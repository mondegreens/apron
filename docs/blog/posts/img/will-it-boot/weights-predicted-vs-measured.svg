<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 674" width="760" height="674" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img">
<title>Weights: predicted before renting, then measured</title>

