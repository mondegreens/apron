<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="p99 TTFT per model, sorted, with a 2-second reference line">
  <style>
    .viz-root {
      color-scheme: light;
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #9a9a96;
      --grid: #ececea;
      --series-1: #2a78d6;
      --ref-line: #9a9a96;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .viz-root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --text-primary: #f0f0ec;
        --text-secondary: #b0b0a8;
        --text-muted: #6e6e68;
        --grid: #2e2e2c;
        --series-1: #3987e5;
        --ref-line: #6e6e68;
      }
    }
    :root[data-theme="dark"] .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #f0f0ec;
      --text-secondary: #b0b0a8;
      --text-muted: #6e6e68;
      --grid: #2e2e2c;
      --series-1: #3987e5;
      --ref-line: #6e6e68;
    }
    .viz-root text {
      font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', sans-serif;
    }
  </style>
  <g class="viz-root">
    <rect width="720" height="440" fill="var(--surface-1)"/>

    <text x="40" y="30" font-size="18" font-weight="700" fill="var(--text-primary)"
          letter-spacing="-0.5">p99 TTFT</text>
    <text x="128" y="30" font-size="12" fill="var(--text-secondary)">time to first token, inference-only</text>
    <text x="40" y="48" font-size="11" fill="var(--text-muted)">ISL 512 · OSL 128 · concurrency 4 · sorted fastest first</text>

    <!-- Chart: bars x=160..690 (530px), y=58..400 -->
    <!-- Scale: 0..6 s = 530px. 1 s = 88.33px -->
    <line x1="160" y1="56" x2="160" y2="402" stroke="var(--grid)" stroke-width="1"/>
    <line x1="248.3" y1="56" x2="248.3" y2="402" stroke="var(--grid)" stroke-width="1"/>
    <line x1="336.7" y1="56" x2="336.7" y2="402" stroke="var(--grid)" stroke-width="1"/>
    <line x1="425.0" y1="56" x2="425.0" y2="402" stroke="var(--grid)" stroke-width="1"/>
    <line x1="513.3" y1="56" x2="513.3" y2="402" stroke="var(--grid)" stroke-width="1"/>
    <line x1="601.7" y1="56" x2="601.7" y2="402" stroke="var(--grid)" stroke-width="1"/>
    <line x1="690.0" y1="56" x2="690.0" y2="402" stroke="var(--grid)" stroke-width="1"/>

    <text x="160" y="418" font-size="10" fill="var(--text-muted)" text-anchor="middle">0</text>
    <text x="248.3" y="418" font-size="10" fill="var(--text-muted)" text-anchor="middle">1 s</text>
    <text x="336.7" y="418" font-size="10" fill="var(--text-muted)" text-anchor="middle">2 s</text>
    <text x="425.0" y="418" font-size="10" fill="var(--text-muted)" text-anchor="middle">3 s</text>
    <text x="513.3" y="418" font-size="10" fill="var(--text-muted)" text-anchor="middle">4 s</text>
    <text x="601.7" y="418" font-size="10" fill="var(--text-muted)" text-anchor="middle">5 s</text>
    <text x="690.0" y="418" font-size="10" fill="var(--text-muted)" text-anchor="middle">6 s</text>

    <!-- Reference line at 2s — neutral, not judgmental -->
    <line x1="336.7" y1="56" x2="336.7" y2="402" stroke="var(--ref-line)" stroke-width="1.5"
          stroke-dasharray="6,4" opacity="0.5"/>
    <text x="340" y="68" font-size="9" fill="var(--ref-line)" opacity="0.7">2 s (example SLO)</text>

    <!-- 12 bars. Height=20, gap=8 (28px each). y starts at 76 -->

    <!-- 1. gpt-oss-20b: 0.12s -->
    <text x="154" y="90" font-size="11" fill="var(--text-primary)" text-anchor="end">gpt-oss-20b</text>
    <text x="154" y="101" font-size="9" fill="var(--text-muted)" text-anchor="end">1×4090</text>
    <rect x="160" y="78" width="10.6" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="176" y="92" font-size="10" fill="var(--text-secondary)">0.12 s</text>

    <!-- 2. Qwen3.6 FP8: 0.14s -->
    <text x="154" y="118" font-size="11" fill="var(--text-primary)" text-anchor="end">Qwen3.6 FP8</text>
    <text x="154" y="129" font-size="9" fill="var(--text-muted)" text-anchor="end">1×H100</text>
    <rect x="160" y="106" width="12.4" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="178" y="120" font-size="10" fill="var(--text-secondary)">0.14 s</text>

    <!-- 3. Muse-Glimmer: 0.18s -->
    <text x="154" y="146" font-size="11" fill="var(--text-primary)" text-anchor="end">Muse-Glimmer</text>
    <text x="154" y="157" font-size="9" fill="var(--text-muted)" text-anchor="end">1×H100</text>
    <rect x="160" y="134" width="15.9" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="180" y="148" font-size="10" fill="var(--text-secondary)">0.18 s</text>

    <!-- 4. Qwen3.8-27B: 0.19s -->
    <text x="154" y="174" font-size="11" fill="var(--text-primary)" text-anchor="end">Qwen3.8-27B</text>
    <text x="154" y="185" font-size="9" fill="var(--text-muted)" text-anchor="end">1×H100</text>
    <rect x="160" y="162" width="16.8" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="181" y="176" font-size="10" fill="var(--text-secondary)">0.19 s</text>

    <!-- 5. Gemma 4: 0.20s -->
    <text x="154" y="202" font-size="11" fill="var(--text-primary)" text-anchor="end">Gemma 4 31B</text>
    <text x="154" y="213" font-size="9" fill="var(--text-muted)" text-anchor="end">1×H100</text>
    <rect x="160" y="190" width="17.7" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="182" y="204" font-size="10" fill="var(--text-secondary)">0.20 s</text>

    <!-- 6. GLM-5.3-Flash: 0.38s -->
    <text x="154" y="230" font-size="11" fill="var(--text-primary)" text-anchor="end">GLM-5.3-Flash</text>
    <text x="154" y="241" font-size="9" fill="var(--text-muted)" text-anchor="end">4×H200</text>
    <rect x="160" y="218" width="33.6" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="198" y="232" font-size="10" fill="var(--text-secondary)">0.38 s · 112 ms/tok</text>

    <!-- 7. Nemotron-3.5: 0.62s -->
    <text x="154" y="258" font-size="11" fill="var(--text-primary)" text-anchor="end">Nemotron-3.5</text>
    <text x="154" y="269" font-size="9" fill="var(--text-muted)" text-anchor="end">1×H100</text>
    <rect x="160" y="246" width="54.8" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="220" y="260" font-size="10" fill="var(--text-secondary)">0.62 s</text>

    <!-- 8. V4.1-Flash: 0.75s -->
    <text x="154" y="286" font-size="11" fill="var(--text-primary)" text-anchor="end">V4.1-Flash</text>
    <text x="154" y="297" font-size="9" fill="var(--text-muted)" text-anchor="end">4×H200</text>
    <rect x="160" y="274" width="66.2" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="232" y="288" font-size="10" fill="var(--text-secondary)">0.75 s · 22 ms/tok</text>

    <!-- 9. GLM-4.7-Flash: 1.32s -->
    <text x="154" y="314" font-size="11" fill="var(--text-primary)" text-anchor="end">GLM-4.7-Flash</text>
    <text x="154" y="325" font-size="9" fill="var(--text-muted)" text-anchor="end">1×H100</text>
    <rect x="160" y="302" width="116.6" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="282" y="316" font-size="10" fill="var(--text-secondary)">1.32 s</text>

    <!-- 10. gpt-oss-120b: 2.29s -->
    <text x="154" y="342" font-size="11" fill="var(--text-primary)" text-anchor="end">gpt-oss-120b</text>
    <text x="154" y="353" font-size="9" fill="var(--text-muted)" text-anchor="end">1×H100</text>
    <rect x="160" y="330" width="202.3" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="368" y="344" font-size="10" fill="var(--text-secondary)">2.29 s</text>

    <!-- 11. Qwen3.8-Flash-Next: 2.37s -->
    <text x="154" y="370" font-size="11" fill="var(--text-primary)" text-anchor="end">Qwen3.8-Flash-Next</text>
    <text x="154" y="381" font-size="9" fill="var(--text-muted)" text-anchor="end">4×H200</text>
    <rect x="160" y="358" width="209.4" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="375" y="372" font-size="10" fill="var(--text-secondary)">2.37 s · 22 ms/tok</text>

    <!-- 12. V4-Flash: 5.42s -->
    <text x="154" y="398" font-size="11" fill="var(--text-primary)" text-anchor="end">V4-Flash</text>
    <text x="154" y="409" font-size="9" fill="var(--text-muted)" text-anchor="end">4×H200</text>
    <rect x="160" y="386" width="478.8" height="20" rx="0 4 4 0" fill="var(--series-1)"/>
    <text x="644" y="400" font-size="10" fill="var(--text-secondary)">5.42 s · 49 ms/tok</text>

    <!-- Footer -->
    <text x="160" y="438" font-size="10" fill="var(--text-muted)">ms/tok = TPOT (decode, bandwidth-bound). Reference line: 2 s example SLO — your target may differ.</text>
  </g>
</svg>
