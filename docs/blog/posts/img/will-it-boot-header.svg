<svg viewBox="0 0 780 576" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="GPU memory breakdown per model: weight memory, KV cache pool, and overhead against GPU capacity">
  <style>
    .viz-root {
      color-scheme: light;
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #9a9a96;
      --grid: #ececea;
      --series-weight: #2a78d6;
      --series-kv: #1baf7a;
      --series-overhead: #e8e8e6;
      --gpu-line: #e34948;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .viz-root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --text-primary: #f0f0ec;
        --text-secondary: #b0b0a8;
        --text-muted: #6e6e68;
        --grid: #2e2e2c;
        --series-weight: #3987e5;
        --series-kv: #199e70;
        --series-overhead: #333330;
        --gpu-line: #e66767;
      }
    }
    :root[data-theme="dark"] .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #f0f0ec;
      --text-secondary: #b0b0a8;
      --text-muted: #6e6e68;
      --grid: #2e2e2c;
      --series-weight: #3987e5;
      --series-kv: #199e70;
      --series-overhead: #333330;
      --gpu-line: #e66767;
    }
    .viz-root text {
      font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', sans-serif;
    }
  </style>
  <g class="viz-root">
    <rect width="780" height="540" fill="var(--surface-1)"/>

    <!-- Title -->
    <text x="40" y="32" font-size="18" font-weight="700" fill="var(--text-primary)"
          letter-spacing="-0.5">How the GPU memory is used</text>
    <text x="40" y="50" font-size="12" fill="var(--text-secondary)">Measured weight memory and KV cache pool per GPU, against the GPU's usable capacity</text>

    <!-- Legend (top, beside title) -->
    <rect x="520" y="22" width="12" height="12" rx="2" fill="var(--series-weight)"/>
    <text x="536" y="33" font-size="11" fill="var(--text-secondary)">weights</text>
    <rect x="588" y="22" width="12" height="12" rx="2" fill="var(--series-kv)"/>
    <text x="604" y="33" font-size="11" fill="var(--text-secondary)">KV cache pool</text>
    <rect x="690" y="22" width="12" height="12" rx="2" fill="var(--series-overhead)"/>
    <text x="706" y="33" font-size="11" fill="var(--text-secondary)">other</text>

    <!-- Chart area: labels x=0..155, bars x=160..740 (580px), y=64..520 -->
    <!-- Scale: 0..150 GiB = 580px. 1 GiB = 3.867px -->
    <!-- Grid lines (light, solid, hairline per dataviz spec) -->
    <line x1="160" y1="64" x2="160" y2="520" stroke="var(--grid)" stroke-width="1"/>
    <line x1="276.0" y1="64" x2="276.0" y2="520" stroke="var(--grid)" stroke-width="1"/><!-- 30 -->
    <line x1="392.0" y1="64" x2="392.0" y2="520" stroke="var(--grid)" stroke-width="1"/><!-- 60 -->
    <line x1="508.0" y1="64" x2="508.0" y2="520" stroke="var(--grid)" stroke-width="1"/><!-- 90 -->
    <line x1="624.0" y1="64" x2="624.0" y2="520" stroke="var(--grid)" stroke-width="1"/><!-- 120 -->
    <line x1="740.0" y1="64" x2="740.0" y2="520" stroke="var(--grid)" stroke-width="1"/><!-- 150 -->

    <text x="160" y="538" font-size="10" fill="var(--text-muted)" text-anchor="middle">0</text>
    <text x="276" y="538" font-size="10" fill="var(--text-muted)" text-anchor="middle">30</text>
    <text x="392" y="538" font-size="10" fill="var(--text-muted)" text-anchor="middle">60</text>
    <text x="508" y="538" font-size="10" fill="var(--text-muted)" text-anchor="middle">90</text>
    <text x="624" y="538" font-size="10" fill="var(--text-muted)" text-anchor="middle">120</text>
    <text x="740" y="538" font-size="10" fill="var(--text-muted)" text-anchor="middle">150</text>
    <text x="450" y="556" font-size="11" fill="var(--text-secondary)" text-anchor="middle">GiB per GPU</text>

    <!-- Footer -->
    <text x="160" y="572" font-size="10" fill="var(--text-muted)">Red line = GPU usable memory. Green = room for concurrent requests. All from vLLM's memory report.</text>

    <!-- 12 rows. Bar height=20px, gap=14px. Total: 12×20 + 11×14 = 394px -->
    <!-- GPU capacity lines (vertical, dashed, per GPU tier) -->
    <!-- 4090: 24 GiB → x=160+24×3.867=252.8 -->
    <!-- H100: 80 GiB → x=160+80×3.867=469.3 -->
    <!-- H200: 141 GiB → x=160+141×3.867=705.2 (per GPU) -->

    <!-- ===== SECTION: RTX 4090 (24 GiB) ===== -->
    <line x1="40" y1="64" x2="740" y2="64" stroke="var(--grid)" stroke-width="1"/>
    <text x="44" y="76" font-size="10" fill="var(--gpu-line)" font-weight="600">RTX 4090 · 24 GiB</text>

    <!-- GPU capacity marker for 4090 -->
    <line x1="252.8" y1="68" x2="252.8" y2="96" stroke="var(--gpu-line)" stroke-width="1.5" opacity="0.4"/>

    <!-- 1. gpt-oss-20b: weights 13.80, KV 4.3, GPU 24 → overhead = 24-13.80-4.3=5.9 -->
    <text x="155" y="88" font-size="11" fill="var(--text-primary)" text-anchor="end">gpt-oss-20b</text>
    <rect x="160" y="74" width="53.4" height="20" rx="0 0 0 0" fill="var(--series-weight)"/><!-- 13.80 -->
    <rect x="215.4" y="74" width="16.6" height="20" fill="var(--series-kv)"/><!-- 4.3 -->
    <rect x="234.0" y="74" width="16.8" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/><!-- overhead to 24 -->

    <!-- ===== SECTION: H100 80 GiB ===== -->
    <line x1="40" y1="104" x2="740" y2="104" stroke="var(--grid)" stroke-width="1"/>
    <text x="44" y="116" font-size="10" fill="var(--gpu-line)" font-weight="600">H100 80 GB · 1 GPU</text>

    <!-- GPU capacity marker for H100 — stops at section boundary -->
    <line x1="469.3" y1="108" x2="469.3" y2="350" stroke="var(--gpu-line)" stroke-width="1.5" opacity="0.4"/>

    <!-- 2. Qwen3.6-35B FP8: weights 34.23, KV 32.4, GPU 80 → overhead=13.37 -->
    <text x="155" y="134" font-size="11" fill="var(--text-primary)" text-anchor="end">Qwen3.6 FP8</text>
    <rect x="160" y="120" width="132.4" height="20" fill="var(--series-weight)"/>
    <rect x="294.4" y="120" width="125.3" height="20" fill="var(--series-kv)"/>
    <rect x="421.7" y="120" width="47.6" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>
    <text x="350" y="134" font-size="9" fill="#ffffff" font-weight="500">147K tokens</text>

    <!-- 3. Qwen3.8-27B: weights 51.10, KV 16.3, overhead=12.6 -->
    <text x="155" y="168" font-size="11" fill="var(--text-primary)" text-anchor="end">Qwen3.8-27B</text>
    <rect x="160" y="154" width="197.6" height="20" fill="var(--series-weight)"/>
    <rect x="359.6" y="154" width="63.1" height="20" fill="var(--series-kv)"/>
    <rect x="424.7" y="154" width="44.6" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>

    <!-- 4. Muse-Glimmer: weights 55.83, KV 11.0, overhead=13.17 -->
    <text x="155" y="202" font-size="11" fill="var(--text-primary)" text-anchor="end">Muse-Glimmer</text>
    <rect x="160" y="188" width="215.9" height="20" fill="var(--series-weight)"/>
    <rect x="377.9" y="188" width="42.5" height="20" fill="var(--series-kv)"/>
    <rect x="422.4" y="188" width="46.9" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>

    <!-- 5. GLM-4.7-Flash: weights 55.87, KV 8.5, overhead=15.63 -->
    <text x="155" y="236" font-size="11" fill="var(--text-primary)" text-anchor="end">GLM-4.7-Flash</text>
    <rect x="160" y="222" width="216.0" height="20" fill="var(--series-weight)"/>
    <rect x="378.0" y="222" width="32.9" height="20" fill="var(--series-kv)"/>
    <rect x="412.9" y="222" width="56.4" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>

    <!-- 6. Gemma 4: weights 58.99, KV 8.6, overhead=12.41 -->
    <text x="155" y="270" font-size="11" fill="var(--text-primary)" text-anchor="end">Gemma 4 31B</text>
    <rect x="160" y="256" width="228.1" height="20" fill="var(--series-weight)"/>
    <rect x="390.1" y="256" width="33.3" height="20" fill="var(--series-kv)"/>
    <rect x="425.4" y="256" width="43.9" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>
    <text x="475" y="270" font-size="9" fill="var(--gpu-line)" font-weight="500">10K tokens!</text>

    <!-- 7. Nemotron-3.5: weights 58.92, KV 9.0, overhead=12.08 -->
    <text x="155" y="304" font-size="11" fill="var(--text-primary)" text-anchor="end">Nemotron-3.5</text>
    <rect x="160" y="290" width="227.8" height="20" fill="var(--series-weight)"/>
    <rect x="389.8" y="290" width="34.8" height="20" fill="var(--series-kv)"/>
    <rect x="426.6" y="290" width="42.7" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>

    <!-- 8. gpt-oss-120b: weights 61.43, KV 5.7, overhead=12.87 -->
    <text x="155" y="338" font-size="11" fill="var(--text-primary)" text-anchor="end">gpt-oss-120b</text>
    <rect x="160" y="324" width="237.6" height="20" fill="var(--series-weight)"/>
    <rect x="399.6" y="324" width="22.0" height="20" fill="var(--series-kv)"/>
    <rect x="423.6" y="324" width="45.7" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>

    <!-- ===== SECTION: H200 ×4 (141 GiB per GPU) ===== -->
    <line x1="40" y1="366" x2="740" y2="366" stroke="var(--grid)" stroke-width="1"/>
    <text x="44" y="378" font-size="10" fill="var(--gpu-line)" font-weight="600">H200 141 GB · 4 GPUs (per-GPU view)</text>

    <!-- GPU capacity marker for H200 -->
    <line x1="705.2" y1="388" x2="705.2" y2="520" stroke="var(--gpu-line)" stroke-width="1.5" opacity="0.4"/>

    <!-- 9. DeepSeek-V4-Flash: weights 37.80/gpu, KV 81.9, overhead=21.3 -->
    <text x="155" y="408" font-size="11" fill="var(--text-primary)" text-anchor="end">V4-Flash</text>
    <rect x="160" y="394" width="146.2" height="20" fill="var(--series-weight)"/>
    <rect x="308.2" y="394" width="316.7" height="20" fill="var(--series-kv)"/>
    <rect x="626.9" y="394" width="78.3" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>
    <text x="450" y="408" font-size="9" fill="#ffffff" font-weight="500">422K tokens</text>

    <!-- 10. Qwen3.8-Flash-Next: weights 60.87/gpu, KV 60.2, overhead=19.93 -->
    <text x="155" y="442" font-size="11" fill="var(--text-primary)" text-anchor="end">Qwen3.8-Flash-Next</text>
    <rect x="160" y="428" width="235.3" height="20" fill="var(--series-weight)"/>
    <rect x="397.3" y="428" width="232.8" height="20" fill="var(--series-kv)"/>
    <rect x="632.1" y="428" width="73.1" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>
    <text x="500" y="442" font-size="9" fill="#ffffff" font-weight="500">4.06M tokens</text>

    <!-- 11. GLM-5.3-Flash: weights 76.37/gpu, KV 45.6, overhead=19.03 -->
    <text x="155" y="476" font-size="11" fill="var(--text-primary)" text-anchor="end">GLM-5.3-Flash</text>
    <rect x="160" y="462" width="295.3" height="20" fill="var(--series-weight)"/>
    <rect x="457.3" y="462" width="176.3" height="20" fill="var(--series-kv)"/>
    <rect x="635.6" y="462" width="69.6" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>
    <text x="540" y="476" font-size="9" fill="#ffffff" font-weight="500">3.1M tokens</text>

    <!-- 12. DeepSeek-V4.1-Flash: weights 79.07/gpu, KV 40.4, overhead=21.53 -->
    <text x="155" y="510" font-size="11" fill="var(--text-primary)" text-anchor="end">V4.1-Flash</text>
    <rect x="160" y="496" width="305.8" height="20" fill="var(--series-weight)"/>
    <rect x="467.8" y="496" width="156.2" height="20" fill="var(--series-kv)"/>
    <rect x="626.0" y="496" width="79.2" height="20" fill="var(--series-overhead)" rx="0 4 4 0"/>
    <text x="540" y="510" font-size="9" fill="#ffffff" font-weight="500">2.94M tokens</text>

  </g>
</svg>
