version: 2
updates:
  - package-ecosystem: uv
    directory: /
    # The Apron Runner image is pinned (every record names its digest) and
    # changes only with a deliberate runner release; zensical is pinned so
    # the blog builds.
    exclude-paths:
      - docker/**
    ignore:
      - dependency-name: zensical
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
