repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        alias: format
      - id: ruff-format
        alias: format

  - repo: local
    hooks:
      - id: types
        name: types
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: boundaries
        name: boundaries
        entry: uv run lint-imports --config pyproject.toml
        language: system
        types: [python]
        pass_filenames: false

      - id: identity
        name: identity
        entry: uv run pytest tests/unit/test_canonical.py -v
        language: system
        pass_filenames: false
        files: '(src/apron/domain/.*|tests/unit/test_canonical\.py|tests/vectors/)'

      - id: determinism
        name: determinism
        entry: uv run pytest tests/unit/test_ports.py -v
        language: system
        pass_filenames: false
        files: '(src/apron/domain/.*|tests/unit/test_ports\.py)'

      - id: supply-chain
        name: supply-chain
        entry: bash -c 'uv export --format pylock.toml --no-hashes -o pylock.check.toml && diff pylock.toml pylock.check.toml && rm pylock.check.toml'
        language: system
        pass_filenames: false
        files: '(pyproject\.toml|uv\.lock|pylock\.toml)'

      - id: docs
        name: docs
        entry: uv run lychee --no-progress '**/*.md'
        language: system
        pass_filenames: false
        files: '\.md$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        alias: secrets
